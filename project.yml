name: MultiFinder
options:
  bundleIdPrefix: com.multifinder
  deploymentTarget:
    macOS: "14.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.9"
    MACOSX_DEPLOYMENT_TARGET: "14.0"
    SWIFT_STRICT_CONCURRENCY: complete
# Release signing (Developer ID) pulls DEVELOPMENT_TEAM from the optional,
# untracked Signing.local.xcconfig via the tracked Signing.release.xcconfig.
# See docs/DISTRIBUTION.md. Debug stays unsigned with no Hardened Runtime.
configFiles:
  Release: Signing.release.xcconfig
targets:
  MultiFinder:
    type: application
    platform: macOS
    sources:
      - path: MultiFinder
    dependencies:
      - target: mfd
        embed: false
    postBuildScripts:
      - name: Embed mfd CLI
        script: |
          HELPERS_DIR="$TARGET_BUILD_DIR/$CONTENTS_FOLDER_PATH/Helpers"
          /bin/mkdir -p "$HELPERS_DIR"
          /usr/bin/ditto "$BUILT_PRODUCTS_DIR/mfd" "$HELPERS_DIR/mfd"
          /bin/chmod 755 "$HELPERS_DIR/mfd"
        inputFiles:
          - $(BUILT_PRODUCTS_DIR)/mfd
        outputFiles:
          - $(TARGET_BUILD_DIR)/$(CONTENTS_FOLDER_PATH)/Helpers/mfd
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.multifinder.app
        INFOPLIST_FILE: MultiFinder/Info.plist
        CODE_SIGN_ENTITLEMENTS: MultiFinder/MultiFinder.entitlements
        CODE_SIGN_IDENTITY: "-"
        CODE_SIGN_STYLE: Manual
        PRODUCT_NAME: MultiFinder
        MARKETING_VERSION: "1.0.0"
        CURRENT_PROJECT_VERSION: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        COMBINE_HIDPI_IMAGES: YES
        ENABLE_HARDENED_RUNTIME: NO
      configs:
        Release:
          ENABLE_HARDENED_RUNTIME: YES
          CODE_SIGN_STYLE: Manual
          CODE_SIGN_IDENTITY: "Developer ID Application"
  mfd:
    type: tool
    platform: macOS
    sources:
      - path: MFDCLI
    settings:
      base:
        PRODUCT_NAME: mfd
        CODE_SIGN_IDENTITY: "-"
        CODE_SIGN_STYLE: Manual
        ENABLE_HARDENED_RUNTIME: NO
      configs:
        Release:
          ENABLE_HARDENED_RUNTIME: YES
          CODE_SIGN_STYLE: Manual
          CODE_SIGN_IDENTITY: "Developer ID Application"
  MultiFinderTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: MultiFinderTests
    dependencies:
      - target: MultiFinder
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.multifinder.tests
        GENERATE_INFOPLIST_FILE: YES
        CODE_SIGNING_ALLOWED: NO
